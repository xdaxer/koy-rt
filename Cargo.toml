[workspace]
resolver = "2"
members = ["crates/koy-core", "crates/koy-platform", "crates/koy-watchdog", "crates/koy-app"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.2.13"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1"
sha2 = "0.10"
windows = "0.62"
windows-collections = "0.3"
windows-core = "0.62"
koy-core = { path = "crates/koy-core", default-features = false }
koy-platform = { path = "crates/koy-platform", default-features = false }
