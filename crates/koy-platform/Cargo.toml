[package]
name = "koy-platform"
description = "koy/src/Platform karşılığı: Core sözleşmelerinin Windows uygulamaları."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
koy-core = { workspace = true, features = ["all"] }
chrono.workspace = true
sha2.workspace = true
serde_json.workspace = true
serde.workspace = true
windows-collections.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Devices_Geolocation",
    "Devices_Radios",
    "Devices_WiFi",
    "Graphics_Imaging",
    "Media_Control",
    "Networking_Connectivity",
    "Security_Credentials",
    "Security_Cryptography",
    "Security_Cryptography_DataProtection",
    "Storage",
    "Storage_Streams",
    "System_Power",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Devices_Bluetooth",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Search",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Shutdown",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[features]
default = ["watchdog-launcher"]
# Görev çubuğu gizlenince gözcüyü başlatır, temiz geri yüklemede durdurur. Gözcünün kendisi bu feature'sız derler
# (C#'taki boş kısmi yöntemlerin karşılığı).
watchdog-launcher = []
