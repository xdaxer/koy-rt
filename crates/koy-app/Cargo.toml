[package]
name = "koy-app"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "koy"
path = "src/main.rs"

[dependencies]
koy-core = { workspace = true, features = ["all"] }
koy-platform = { workspace = true, features = ["watchdog-launcher"] }
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06"] }
raw-window-handle = "0.6"
windows = { workspace = true, features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_DataExchange"] }
windows-core.workspace = true
chrono.workspace = true

[build-dependencies]
slint-build = "1"
